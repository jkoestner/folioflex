[build-system]
requires = ["setuptools>=62.6"]
build-backend = "setuptools.build_meta"

[project]
name = "folioflex"
description = "A collection of portfolio tracking capabilities"
dynamic = ["version"]
authors = [{ name = "John Koestner", email = "johnkoestner@outlook.com" }]
readme = 'README.md'
license = { file = 'LICENSE.md' }
requires-python = '>=3.12'

dependencies = [
    "ipywidgets>=8.1.9",
    "fredapi>=0.5.2",
    "jupyter-dash>=0.4.2",
    "jupyterlab>=4.6.4",
    "kaleido>=1.5.0",          
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pandas-market-calendars>=5.5.0",
    "pyxirr>=0.10.8",
    "sqlalchemy>=2.1.6",
    "yfinance>=1.7.0",
    "tzlocal>=5.4.5",

    # web
    "dash>=4.4.1",
    "dash-ag-grid>=35.3.0",
    "dash_bootstrap_components>=2.0.4",
    "dash-core-components>=2.0.0",
    "dash-html-components>=2.0.0",
    "dash-mantine-components>=2.8.1",
    "dash-renderer>=1.9.1",
    "dash-table>=5.0.0",
    "Flask>=3.1.3",
    "Flask-Compress>=1.25",
    "Flask-Login>=0.6.3",
    "gunicorn>=26.2.0",
    "lxml>=6.1.3",

    # worker
    "celery>=5.6.3",
    "flower>=2.2.0",
    "redis>=8.1.0",

    # gpt
    "g4f>=8.8.6",         # this package has loose testing support
    "hugchat>=0.5.1",
    "openai>=3.39.0",
    "pyautogui>=0.9.54",
    "seleniumbase>=4.56.4",

    # budget
    "emoji>=2.16.0",
    "gensim>=4.4.0",  
    "psycopg[binary]>=3.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",            
]

[project.optional-dependencies]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "jupyterlab-code-formatter>=3.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "sphinx>=9.1.1",
    "sphinx_rtd_theme>=3.1.0",
]

[project.scripts]
ffx = "folioflex.utils.cli:cli" # the entry points provide console scripts at command line

[project.urls]
homepage = "https://github.com/jkoestner/folioflex"
documentation = 'https://jkoestner.github.io/folioflex/'
repository = 'https://github.com/jkoestner/folioflex'

# TODO: Remove after setuptools support is dropped.
[tool.setuptools]
include-package-data = true # include files from MANIFEST.in

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "folioflex.version.version" }

# coverage config file for pytest-cov coming from
# https://pytest-cov.readthedocs.io/en/latest/
# run using pytest --cov=folioflex --cov-report=html
[tool.coverage.run]
data_file = "docs/coverage/.coverage"
omit = [
    "folioflex/dashboard/*", # omit everything in /dashboard
    "__init__.py",           # omit init files
]

[tool.coverage.html]
directory = "docs/coverage/htmlcov"

[tool.ruff]
line-length = 88
fix = false
unfixable = []
extend-include = ["*.ipynb"]

select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pydocstyle
    "D",
    # flake8-2020
    "YTT",
    # flake8-bugbear
    "B",
    # flake8-quotes
    "Q",
    # flake8-debugger
    "T10",
    # flake8-gettext
    "INT",
    # pylint
    "PL",
    # misc lints
    "PIE",
    # flake8-pyi
    "PYI",
    # tidy imports
    "TID",
    # implicit string concatenation
    "ISC",
    # type-checking imports
    "TCH",
    # comprehensions
    "C4",
    # pygrep-hooks
    "PGH",
    # Ruff-specific rules
    "RUF",
    # flake8-bandit: exec-builtin
    "S102",
    # numpy-legacy-random
    "NPY002",
    # Perflint
    "PERF",
    # flynt
    "FLY",
    # flake8-logging-format
    "G",
]

ignore = [
    ### Intentionally disabled
    # type hinting exceptions
    "ANN101",
    "ANN401",
    # logging statement uses f-string
    "G004",
    # ignore __init__ docstring
    "D107",
    # these are conflicting errors
    "D203",
    "D212",
    # ignore == False vs is False due to pandas series
    "E712",
    "ISC001",
    # ignore magic numbers
    "PLR2004",
    # ignore too many return statements or branches
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint]
exclude = ["*.ipynb"]
pylint.max-args = 10
